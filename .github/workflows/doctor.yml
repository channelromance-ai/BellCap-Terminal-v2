# Runs the data health check from GitHub's machines, not your PC.
#
# This is the test that matters for v2: v1 had to fetch on your computer
# because Yahoo blocked GitHub. Every source here was chosen to work from the
# cloud, and this job proves it. Results show on the run's Summary page as a
# table; health.json is attached as a download.
#
# Run it by hand: Actions tab > "Data health" > Run workflow.
name: Data health

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 12 * * 1-5"     # weekdays 12:00 UTC (07:00 Winnipeg)

permissions:
  contents: read

jobs:
  doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Offline tests
        run: python -m unittest discover tests

      - name: Check every source from the cloud
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python run.py doctor

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: health
          path: data/health.json
